    function loadDay(id){return loadStoredDay(DAY_KEYS[id])}
    function saveDay(id){localStorage.setItem(DAY_KEYS[id],JSON.stringify(state[id]))}
    const state=Object.fromEntries(Object.keys(data).map(id=>[id,loadDay(id)]));
    const migrationSources={tuesday:loadStoredDay(LEGACY_TUESDAY_KEY)};
    function questionTouched(s,id){return s.completedA.includes(id)||Object.prototype.hasOwnProperty.call(s.selectedAnswers,id)||Object.prototype.hasOwnProperty.call(s.wrongAttempts,id)}
    function copyQuestion(fromDay,fromId,toDay,toId,{answer=true}={}){const from=state[fromDay]||migrationSources[fromDay],to=state[toDay];if(!from||!to||!questionTouched(from,fromId)||questionTouched(to,toId))return false;if(from.completedA.includes(fromId))to.completedA.push(toId);if(answer&&Object.prototype.hasOwnProperty.call(from.selectedAnswers,fromId))to.selectedAnswers[toId]=from.selectedAnswers[fromId];if(Object.prototype.hasOwnProperty.call(from.wrongAttempts,fromId))to.wrongAttempts[toId]=from.wrongAttempts[fromId];return true}
    function copyTask(fromDay,fromId,toDay,toId){const from=state[fromDay]||migrationSources[fromDay],to=state[toDay];if(!from||!to||!Object.prototype.hasOwnProperty.call(from.completedB,fromId)||Object.prototype.hasOwnProperty.call(to.completedB,toId))return false;to.completedB[toId]=from.completedB[fromId];return true}
    let migratedDays=new Set();
    if(copyQuestion('tuesday','a1','wednesday','a11'))migratedDays.add('wednesday');
    if(copyQuestion('tuesday','a2','wednesday','a1'))migratedDays.add('wednesday');
    if(copyTask('tuesday','ex1','wednesday','b1'))migratedDays.add('wednesday');
    if(copyQuestion('friday','mode2','thursday','a12'))migratedDays.add('thursday');
    if(copyQuestion('friday','mode1','thursday','a9'))migratedDays.add('thursday');
    migratedDays.forEach(saveDay);
    function quizCard(id,q,i,prefix='a'){const qid=q.id||`${prefix}${i+1}`,number=q.number||i+1;return `<article class="card quiz-card" data-day="${id}" data-q="${qid}" data-group="${prefix}"><div class="card-top"><span class="number">${number}</span><span class="card-tag">${q.tag}</span></div>${q.visual?`<div class="a-visual">${q.visual}</div>`:''}<h3>${q.q}</h3>${q.page?`<span class="book-reference">Skoðaðu bls. ${q.page} í kennslubók</span>`:''}<div class="options">${q.o.map((o,j)=>`<button class="option" data-index="${j}">${o}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><p class="attempt-count" hidden></p></article>`}
    function taskCard(id,t,i){return `<article class="card book-task"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${t.tag}</span></div><h3>${t.title}</h3>${t.guide?`<p class="book-reference">${t.guide}</p>`:''}${t.body?`<div>${t.body}</div>`:''}${t.prompt?`<label for="text-${id}-${t.id}"><strong>${t.prompt}</strong></label><textarea id="text-${id}-${t.id}" data-text="${t.id}" data-day="${id}" placeholder="Skrifaðu svarið hér..."></textarea><ul class="checklist" id="check-${id}-${t.id}" hidden>${t.check.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<label class="task-check"><input type="checkbox" data-day="${id}" data-b="${t.id}"><span>Ég hef lokið verkefninu og varðveiti vinnuna.</span></label></article>`}
    const selfSkills={wednesday:['Ég get útskýrt táknmálið í formúlu meðaltals og reiknað meðaltal úr tíðnidreifingu.','Ég get reiknað vegið meðaltal þegar hópar hafa mismunandi vægi.','Ég get fundið meðalhraða út frá heildarvegalengd og heildartíma.'],thursday:['Ég get fundið miðgildi eftir að gögnum hefur verið raðað.','Ég get borið saman meðaltal og miðgildi þegar öfgagildi eru til staðar.','Ég get notað tíðasta gildi til að lýsa nafnbreytu.'],friday:['Ég get fundið miðgildisbil og stærðirnar L, k, fₘ og c.','Ég get notað raunveruleg endamörk í bilskiptum gögnum.','Ég get valið viðeigandi mælikvarða á miðsækni og rökstutt val mitt.']};
    function selfSection(id){return `<section><p class="section-kicker">Lok dags</p><h2>Hæfniviðmið og sjálfsmat</h2><div class="card self-card"><p><strong>Eftir vinnu dagsins átt þú að geta:</strong></p><ul class="skills">${selfSkills[id].map(s=>`<li>${s.replace(/^Ég get /,'').replace(/^./,c=>c.toLowerCase())}</li>`).join('')}</ul><p class="self-question">Hvernig metur þú stöðu þína eftir vinnu dagsins?</p><div class="self-options" data-self-day="${id}">${[['green','🟢 Örugg/ur'],['yellow','🟡 Smá óvissa'],['red','🔴 Þarf að skoða aftur']].map(([v,l])=>`<button class="self-button" data-value="${v}">${l}</button>`).join('')}</div></div></section>`}
    function commonEnd(id,practice=[]){return `<div class="completion" id="complete-${id}"><strong>Kjarnavinnu dagsins er lokið.</strong></div>${practice.length?`<section><p class="section-kicker">Valfrjálst</p><h2>Meiri æfing</h2><details><summary>Opna Meiri æfingu</summary><div class="details-body">${practice.map(x=>`<p>${x}</p>`).join('')}</div></details></section>`:''}${selfSection(id)}`}
    function standardDayHTML(id){const d=data[id];return `<div class="panel" id="panel-${id}"><section><p class="section-kicker">${d.label} · Kaflar ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">Innlögn kennara</p><h2>Áður en þú byrjar</h2><article class="card info-card"><p>${d.instruction}</p></article></section><section><p class="section-kicker">A · Athugaðu skilninginn</p><h2>Lykilhugmyndir</h2><p class="section-intro">A-hlutinn telst sem eitt framvinduatriði þegar öllum spurningunum er lokið rétt.</p>${d.questions.map((q,i)=>quizCard(id,q,i)).join('')}</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Leystu verkefnin</h2><p class="section-intro">${B_WORK_NOTE}</p>${d.tasks.map((t,i)=>taskCard(id,t,i)).join('')}</section>${commonEnd(id,d.practice)}</div>`}
    function thursdayHTML(){const d=data.thursday;return `<div class="panel" id="panel-thursday"><section><p class="section-kicker">${d.label} · Kaflar ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">A · Leiðsagnarlestur · Kafli 3.2</p><h2>Miðgildi</h2><p class="section-intro">${d.guidedReading}</p>${d.questions.slice(0,3).map((q,i)=>quizCard('thursday',q,i)).join('')}</section><section><p class="section-kicker">A · Leiðsagnarlestur · Kafli 3.3</p><h2>Tíðasta gildi</h2><p class="section-intro">${d.guidedReading}</p><p class="section-intro">A-vinna úr köflum 3.2 og 3.3 telst saman sem eitt framvinduatriði þegar öllum spurningunum er lokið rétt.</p>${d.questions.slice(3).map((q,i)=>quizCard('thursday',q,i+3)).join('')}</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Miðgildi, tíðasta gildi og samanburður</h2><p class="section-intro">${B_WORK_NOTE}</p>${d.tasks.map((t,i)=>taskCard('thursday',t,i)).join('')}</section>${commonEnd('thursday')}</div>`}
    function fridayHTML(){const d=data.friday;return `<div class="panel" id="panel-friday"><section><p class="section-kicker">${d.label} · Kafli ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">Innlögn · 3.2.1</p><h2>Miðgildi úr bilskiptri tíðnidreifingu</h2><article class="card info-card"><p>${d.instruction}</p></article></section><section><p class="section-kicker">A · Athugaðu skilninginn</p><h2>Finndu stærðirnar í formúlunni</h2><div class="a-visual">${d.table}</div><p class="section-intro">A-hlutinn telst sem eitt framvinduatriði þegar öllum spurningunum er lokið rétt.</p>${d.questions.map((q,i)=>quizCard('friday',q,i)).join('')}</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Reiknaðu og túlkaðu</h2><p class="section-intro">${B_WORK_NOTE}</p>${d.tasks.map((t,i)=>taskCard('friday',t,i)).join('')}</section>${commonEnd('friday',d.practice)}</div>`}
    function weeklyHTML(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 3 · Skjáskot</p><h2>Vikuskil</h2><p class="section-intro">Taktu eitt skjáskot af yfirlitinu þegar vinnu vikunnar er lokið.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 3</h3><div class="week-grid" id="weekGrid"></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="daysDone">0 af 3</strong>Loknir dagar</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar A-tilraunir</div></div><p><strong>Rangar tilraunir, sjálfsmat og valfrjáls Meiri æfing hafa ekki áhrif á stig eða framvindu.</strong></p></div><div class="card submission"><h3>Skilaðu eftirfarandi:</h3><ul><li>ljósmyndum, skönnun eða útflutningi af <strong>leystum B-verkefnum</strong>;</li><li><strong>skjáskoti af framvinduyfirlitinu</strong>.</li></ul><button class="primary" id="submissionButton">Opna skilahólf</button></div></section></div>`}
    document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<button class="tab" data-tab="${id}">${l}</button>`).join('');
    document.getElementById('main').innerHTML=standardDayHTML('wednesday')+thursdayHTML()+fridayHTML()+weeklyHTML();
    function questionDef(id,qid){return data[id].questions.find((q,i)=>(q.id||`a${i+1}`)===qid)}
    function renderQuestion(card){const id=card.dataset.day,qid=card.dataset.q,q=questionDef(id,qid),s=state[id],saved=s.selectedAnswers[qid],done=s.completedA.includes(qid),fb=card.querySelector('.feedback'),count=Number(s.wrongAttempts[qid])||0,opts=[...card.querySelectorAll('.option')];opts.forEach(x=>x.classList.remove('selected','correct','incorrect'));if(Number.isInteger(saved)){opts[saved]?.classList.add('selected',done?'correct':'incorrect');fb.className=`feedback show ${done?'good':'bad'}`;fb.textContent=done?`Rétt. ${q.ok}`:`Ekki rétt. ${q.h[Math.min(Math.max(count,1),q.h.length)-1]} Reyndu aftur.`}else{fb.className='feedback';fb.textContent=''}const c=card.querySelector('.attempt-count');c.hidden=!count;c.textContent=count?`Rangar tilraunir: ${count}`:''}
    document.querySelectorAll('.quiz-card').forEach(card=>{renderQuestion(card);card.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{const id=card.dataset.day,qid=card.dataset.q,s=state[id],q=questionDef(id,qid);if(s.completedA.includes(qid))return;const i=Number(btn.dataset.index);s.selectedAnswers[qid]=i;if(i===q.c)s.completedA.push(qid);else s.wrongAttempts[qid]=(Number(s.wrongAttempts[qid])||0)+1;saveDay(id);renderQuestion(card);updateAll()}))});
    document.querySelectorAll('[data-text]').forEach(x=>{const s=state[x.dataset.day];x.value=s.textAnswers[x.dataset.text]||'';const check=document.getElementById(`check-${x.dataset.day}-${x.dataset.text}`),show=()=>{if(check)check.hidden=!x.value.trim()};show();x.addEventListener('input',()=>{s.textAnswers[x.dataset.text]=x.value;saveDay(x.dataset.day);show();updateAll()})});
    document.querySelectorAll('[data-b]').forEach(x=>{const s=state[x.dataset.day];x.checked=!!s.completedB[x.dataset.b];x.addEventListener('change',()=>{s.completedB[x.dataset.b]=x.checked;saveDay(x.dataset.day);updateAll()})});
    function groupDone(id,prefix,needed){return needed.every(q=>state[id].completedA.includes(q))}
    function wrongCount(id,ids){return ids.reduce((n,qid)=>n+(Number(state[id].wrongAttempts[qid])||0),0)}
    function counts(id){const s=state[id];if(id==='wednesday'){const ids=['a11','a3'],a=groupDone(id,'a',ids)?1:0,b=['b1','b3','ex8'].filter(x=>s.completedB[x]).length;return{done:a+b,total:4,wrong:wrongCount(id,ids)}}if(id==='thursday'){const ids=['a10','a8','a5','a12','a9'],a=groupDone(id,'a',ids)?1:0,b1=s.completedB.b1?1:0,b2=s.completedB.b2?1:0,solvellir=s.completedB.solvellir?1:0;return{done:a+b1+b2+solvellir,total:4,wrong:wrongCount(id,ids)}}const ids=['a1','a2','a3','a4'],a=groupDone(id,'a',ids)?1:0,b1=s.completedB.b1?1:0,b3=s.completedB.b3&&(s.textAnswers.b3||'').trim()?1:0;return{done:a+b1+b3,total:3,wrong:wrongCount(id,ids)}}
    function selfSummary(id){const value=weekSelf[id]?.overall;return value==='green'?'🟢 Örugg/ur':value==='yellow'?'🟡 Smá óvissa':value==='red'?'🔴 Þarf að skoða aftur':'—'}
    function updateAll(){Object.keys(data).forEach(id=>document.getElementById(`complete-${id}`).classList.toggle('show',counts(id).done===counts(id).total));let done=0,total=0,daysDone=0,wrong=0,html='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">Lokið</div><div class="week-cell week-head">Kjarni</div><div class="week-cell week-head">Sjálfsmat</div><div class="week-cell week-head">Rangar</div>';Object.keys(data).forEach(id=>{const c=counts(id);done+=c.done;total+=c.total;wrong+=c.wrong;if(c.done===c.total)daysDone++;html+=`<div class="week-cell"><strong>${data[id].label}</strong></div><div class="week-cell">${c.done}/${c.total}</div><div class="week-cell">${c.done===c.total?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${selfSummary(id)}</div><div class="week-cell">${c.wrong}</div>`});document.getElementById('weekGrid').innerHTML=html;document.getElementById('weekProgress').textContent=`${Math.round(done/total*100)}%`;document.getElementById('daysDone').textContent=`${daysDone} af 3`;document.getElementById('wrongTotal').textContent=wrong;const active=document.querySelector('.tab.active')?.dataset.tab||'wednesday',bar=document.getElementById('progressBar'),label=document.getElementById('progressLabel');if(data[active]){const c=counts(active);bar.style.width=`${c.done/c.total*100}%`;label.textContent=`${c.done} af ${c.total} kjarnaverkefnum lokið`}else{bar.style.width=`${done/total*100}%`;label.textContent=`${done} af ${total} kjarnaverkefnum vikunnar lokið`}}
    let weekSelf={};try{weekSelf=JSON.parse(localStorage.getItem(WEEK_SELF_KEY))||{}}catch{}if(!weekSelf.wednesday&&!weekSelf.thursday&&!weekSelf.friday)weekSelf={...weekSelf,wednesday:{s1:weekSelf.s1,s3:weekSelf.s2},thursday:{s1:weekSelf.s3},friday:{s1:weekSelf.s4,s2:weekSelf.s5,s3:weekSelf.s6}};let selfMigrated=false;Object.keys(data).forEach(day=>{weekSelf[day]=weekSelf[day]||{};if(!weekSelf[day].overall){const oldValues=Object.values(weekSelf[day]).filter(v=>['green','yellow','red'].includes(v));if(oldValues.length){weekSelf[day].overall=oldValues.includes('red')?'red':oldValues.includes('yellow')?'yellow':'green';selfMigrated=true}}});if(selfMigrated)localStorage.setItem(WEEK_SELF_KEY,JSON.stringify(weekSelf));document.querySelectorAll('[data-self-day]').forEach(group=>{const day=group.dataset.selfDay;const render=()=>group.querySelectorAll('.self-button').forEach(b=>b.classList.toggle('active',weekSelf[day].overall===b.dataset.value));group.querySelectorAll('.self-button').forEach(b=>b.addEventListener('click',()=>{weekSelf[day].overall=b.dataset.value;localStorage.setItem(WEEK_SELF_KEY,JSON.stringify(weekSelf));render();updateAll()}));render()});
    function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${id}`));localStorage.setItem(TAB_KEY,id);updateAll();scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>switchTab(x.dataset.tab)));document.getElementById('submissionButton').addEventListener('click',()=>window.open(SUBMISSION_URL,'_blank','noopener'));const saved=localStorage.getItem(TAB_KEY);switchTab(tabs.some(([id])=>id===saved)?saved:'wednesday');
  })();
  </script>
