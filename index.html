    const tabs=[['wednesday','Miðvikudagur'],['thursday','Fimmtudagur'],['friday','Föstudagur'],['weekly','Vikuskil']];
    const data={
      wednesday:{label:'Miðvikudagur',chapters:'3.1 og 3.1.1',title:'Meðaltal og vegið meðaltal',intro:'Reiknaðu meðaltal úr gögnum og tíðnidreifingu og notaðu rétt vægi þegar hópar eru misstórir.',instruction:'Taktu sérstaklega eftir úr innlögn kennara hvernig tíðni er notuð við útreikning meðaltals og hvers vegna hópar þurfa mismunandi vægi þegar þeir eru misstórir.',questions:[
        {tag:'Tíðni og fX',visual:'<table class="a-table"><thead><tr><th>X</th><th>f</th></tr></thead><tbody><tr><td>3</td><td>1</td></tr><tr><td>4</td><td>3</td></tr><tr><td>5</td><td>4</td></tr></tbody></table>',q:'Gildið 5 kemur fyrir fjórum sinnum. Hvert er framlag þess til summu allra mælinganna?',o:['4','5','9','20'],c:3,ok:'5 · 4 = 20. Þess vegna notum við fX þegar meðaltal er reiknað úr tíðnidreifingu.',h:['Tíðnin segir hversu oft gildið 5 kemur fyrir.','Hugsaðu um 5 + 5 + 5 + 5.']},
        {tag:'Bilskipt gögn',q:'Eitt bilið í tíðnidreifingu er 75–79. Hvaða gildi notum við sem fulltrúa bilsins þegar meðaltalið er metið?',o:['75','77','79','154'],c:1,ok:'Miðpunkturinn 77 er notaður sem fulltrúi gildanna á bilinu. Athugaðu: Meðaltal úr bilskiptum gögnum er mat. Við vitum ekki nákvæm gildi innan hvers bils og notum miðpunktinn sem fulltrúa þeirra.',h:['Finndu miðpunkt bilsins.','Reiknaðu (75 + 79) / 2.']},

      ],tasks:[

        {id:'b3',tag:'Æfing 3 · dæmi 6',title:'Vegið meðaltal',paper:'Reiknaðu meðalaldur íbúanna samanlagt. Mundu að sveitirnar hafa ekki sama íbúafjölda.'}
      ],practice:['<strong>Æfing 3 · dæmi 5</strong><br>Meiri æfing í fX og meðaltali úr tíðnidreifingu.','<strong>Æfing 3 · dæmi 7</strong><br>Meiri æfing í vegnu meðaltali.']},
      thursday:{label:'Fimmtudagur',chapters:'3.2',title:'Miðgildi',intro:'Finndu miðgildi þegar fjöldi mælinga er oddatala eða jöfn tala og berðu miðgildi saman við meðaltal.',reading:'<p><strong>Lestu bls. 60–61, kafla 3.2 – Miðgildi. Notaðu textann til að svara spurningunum hér fyrir neðan.</strong></p>',questions:[
        {id:'a6',tag:'Hugtakið',q:'Hvaða lýsing passar best við miðgildi?',o:['Summa allra gilda deilt með fjölda þeirra.','Gildið í miðju raðaðs gagnasafns.','Gildið sem kemur oftast fyrir.','Munurinn á hæsta og lægsta gildi.'],c:1,ok:'Miðgildið skiptir röðuðum gögnum þannig að helmingur liggur hvoru megin.',h:['Gögnin þurfa fyrst að vera í stærðarröð.']},

        {id:'a5',tag:'Áhrif öfgagilda',q:'Í fyrirtæki fá átta starfsmenn 100.000 kr. og tveir fá 300.000 kr. Meðallaunin eru 140.000 kr. Hvað sýnir dæmið best?',o:['Meðaltalið hlýtur að vera rangt reiknað.','Allir starfsmenn fá um 140.000 kr.','Há laun tveggja starfsmanna toga meðaltalið upp.','Miðgildi og meðaltal eru alltaf jafnhá.'],c:2,ok:'Meðaltalið notar stærð allra gildanna og getur því færst mikið vegna mjög hárra eða lágra gilda. Miðgildið er síður næmt fyrir slíkum öfgagildum.',h:['Berðu saman laun meirihlutans við meðaltalið.']}
      ],tasks:[
        {id:'b1',tag:'Æfing 3 · dæmi 10',title:'Finndu miðgildið',paper:'Raðaðu gögnunum og finndu miðgildið. Tíðasta gildið í dæminu má bíða til föstudags.'},
        {id:'b2',tag:'Æfing 3 · dæmi 13',title:'Meðaltal og miðgildi launa',paper:'Reiknaðu meðaltal og miðgildi launanna. Berðu niðurstöðurnar saman.',prompt:'Hvor mælikvarðinn lýsir dæmigerðum launum betur? Af hverju? Skrifaðu 1–2 setningar og vísaðu í gögnin eða niðurstöður þínar.',check:['Valdir þú mælikvarða?','Tókstu eftir mjög háu launagildunum?','Útskýrðir þú áhrif þeirra á meðaltalið?']}
      ]},
      friday:{label:'Föstudagur',chapters:'3.2.1 og 3.3',title:'Miðgildi bilskiptra gagna og tíðasta gildi',intro:'Finndu miðgildi úr bilskiptri tíðnidreifingu, túlkaðu tíðasta gildi og veldu viðeigandi mælikvarða á miðsækni.',instruction:'Taktu sérstaklega eftir úr innlögn kennara hvernig miðgildisbilið er fundið og hvað stærðirnar L, k, fₘ og c tákna.',table:'<table class="a-table"><thead><tr><th>Þyngd</th><th>f</th></tr></thead><tbody><tr><td>65–69</td><td>2</td></tr><tr><td>70–74</td><td>10</td></tr><tr><td>75–79</td><td>26</td></tr><tr><td>80–84</td><td>20</td></tr><tr><td>85–89</td><td>12</td></tr><tr><th>Samtals</th><th>70</th></tr></tbody></table>',questions:[
        {tag:'Miðgildisstaður',q:'N = 70. Hvar leitum við að miðgildinu?',o:['Við 26. gildið.','Við 35. gildið.','Við 38. gildið.','Við 70. gildið.'],c:1,ok:'Við leitum að staðnum þar sem 35 gildi eru komin.',h:['Finndu helminginn af 70.']},

        {tag:'k í formúlu',q:'12 gildi eru fyrir neðan miðgildisbilið. Hversu mörg gildi vantar upp í 35?',o:['12','23','26','35'],c:1,ok:'k = 23. Nú höfum við allar stærðirnar sem þarf í formúluna.',h:['Reiknaðu 35 − 12.']}
      ],reading:'<p><strong>Lestu kafla 3.3 – Tíðasta gildi. Notaðu textann til að svara spurningunum hér fyrir neðan.</strong></p>',modeSets:[
        {values:'2, 3, 3, 5, 7',answer:'one'},
        {values:'1, 2, 3, 4',answer:'none'},
        {values:'2, 2, 4, 4, 6',answer:'two'}
      ]}

    function loadDay(id){try{const x=JSON.parse(localStorage.getItem(DAY_KEYS[id])),s=x&&typeof x==='object'?{...emptyDay(),...x}:emptyDay();if(id==='thursday'&&!['a5','a6','a7','a8'].some(k=>s.completedA.includes(k)||Object.prototype.hasOwnProperty.call(s.selectedAnswers,k)||Object.prototype.hasOwnProperty.call(s.wrongAttempts,k))){const map={a4:'a5',a1:'a6',a2:'a7',a3:'a8'};Object.entries(map).forEach(([oldId,newId])=>{if(s.completedA.includes(oldId))s.completedA.push(newId);if(Object.prototype.hasOwnProperty.call(s.selectedAnswers,oldId))s.selectedAnswers[newId]=s.selectedAnswers[oldId];if(Object.prototype.hasOwnProperty.call(s.wrongAttempts,oldId))s.wrongAttempts[newId]=s.wrongAttempts[oldId]})}return s}catch{return emptyDay()}}
    function saveDay(id){localStorage.setItem(DAY_KEYS[id],JSON.stringify(state[id]))}

    function quizCard(id,q,i,prefix='a'){const qid=q.id||`${prefix}${i+1}`,number=q.number||i+1;return `<article class="card quiz-card" data-day="${id}" data-q="${qid}" data-group="${prefix}"><div class="card-top"><span class="number">${number}</span><span class="card-tag">${q.tag}</span></div>${q.visual?`<div class="a-visual">${q.visual}</div>`:''}<h3>${q.q}</h3><div class="options">${q.o.map((o,j)=>`<button class="option" data-index="${j}">${o}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><p class="attempt-count" hidden></p></article>`}
    function taskCard(id,t,i){return `<article class="card book-task"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${t.tag}</span></div>${t.prompt?`<label for="text-${id}-${t.id}"><strong>${t.prompt}</strong></label><textarea id="text-${id}-${t.id}" data-text="${t.id}" data-day="${id}" placeholder="Skrifaðu svarið hér..."></textarea><ul class="checklist" id="check-${id}-${t.id}" hidden>${t.check.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<label class="task-check"><input type="checkbox" data-day="${id}" data-b="${t.id}"><span>Ég hef lokið verkefninu og varðveiti vinnuna.</span></label></article>`}
    const selfSkills={wednesday:['Ég get reiknað meðaltal úr gögnum og tíðnidreifingu.','Ég get notað miðpunkta þegar meðaltal er metið úr bilskiptum gögnum.','Ég get reiknað vegið meðaltal þegar hópar hafa mismunandi vægi.'],thursday:['Ég get útskýrt hvað miðgildi segir um gagnasafn.','Ég get fundið miðgildi þegar fjöldi mælinga er oddatala eða jöfn tala.','Ég get útskýrt hvers vegna miðgildi getur stundum lýst dæmigerðu gildi betur en meðaltal.'],friday:['Ég get fundið miðgildi úr bilskiptri tíðnidreifingu.','Ég get fundið og túlkað tíðasta gildi.','Ég get valið viðeigandi mælikvarða á miðsækni og rökstutt val mitt.']};
    function selfSection(id){return `<section><p class="section-kicker">Lok dags</p><h2>Hæfniviðmið og sjálfsmat</h2><div class="card self-card"><p><strong>Eftir vinnu dagsins átt þú að geta:</strong></p><ul class="skills">${selfSkills[id].map(s=>`<li>${s.replace(/^Ég get /,'').replace(/^./,c=>c.toLowerCase())}</li>`).join('')}</ul><p class="self-question">Hvernig metur þú stöðu þína eftir vinnu dagsins?</p><div class="self-options" data-self-day="${id}">${[['green','🟢 Örugg/ur'],['yellow','🟡 Smá óvissa'],['red','🔴 Þarf að skoða aftur']].map(([v,l])=>`<button class="self-button" data-value="${v}">${l}</button>`).join('')}</div></div></section>`}
    function commonEnd(id,practice=[]){return `<div class="completion" id="complete-${id}"><strong>Kjarnavinnu dagsins er lokið.</strong></div>${practice.length?`<section><p class="section-kicker">Valfrjálst</p><h2>Meiri æfing</h2><details><summary>Opna Meiri æfingu</summary><div class="details-body">${practice.map(x=>`<p>${x}</p>`).join('')}</div></details></section>`:''}${selfSection(id)}`}
    function wednesdayHTML(){const d=data.wednesday;return `<div class="panel" id="panel-wednesday"><section><p class="section-kicker">${d.label} · Kaflar ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">Innlögn kennara</p><h2>Áður en þú byrjar</h2><article class="card info-card"><p>${d.instruction}</p></article></section><section><p class="section-kicker">A · Athugaðu skilninginn</p><h2>Lykilhugmyndir</h2><p class="section-intro">A-hlutinn telst sem eitt framvinduatriði þegar öllum spurningunum er lokið rétt.</p>${d.questions.map((q,i)=>quizCard('wednesday',q,i)).join('')}</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Reiknaðu á blað</h2>${d.tasks.map((t,i)=>taskCard('wednesday',t,i)).join('')}</section>${commonEnd('wednesday',d.practice)}</div>`}
    function thursdayHTML(){const d=data.thursday;return `<div class="panel" id="panel-thursday"><section><p class="section-kicker">${d.label} · Kafli ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">A · Lestur og skilningur</p><h2>Miðgildi</h2><div class="section-intro">${d.reading}</div><p class="section-intro">A-hlutinn telst sem eitt framvinduatriði þegar öllum spurningunum er lokið rétt.</p>${d.questions.map((q,i)=>quizCard('thursday',q,i)).join('')}</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Reiknaðu og túlkaðu</h2>${d.tasks.map((t,i)=>taskCard('thursday',t,i)).join('')}</section>${commonEnd('thursday')}</div>`}
    function modeQuestion(i,s){return `<article class="card mode-card" data-mode="m${i+1}"><div class="card-top"><span class="number">2${'abc'[i]}</span><span class="card-tag">Fjöldi tíðustu gilda</span></div><h3>${s.values}</h3><div class="options">${[['one','Eitt tíðasta gildi'],['none','Ekkert tíðasta gildi'],['two','Tvö tíðustu gildi']].map(([v,l])=>`<button class="option" data-value="${v}">${l}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div></article>`}
    function fridayHTML(){const d=data.friday,modeIntro={id:'mode2',number:1,tag:'Hugtakið',q:'Hvað er tíðasta gildi gagnasafns?',o:['Gildið sem liggur í miðju gagnasafnsins.','Gildið sem kemur oftast fyrir.','Summa allra gilda deilt með fjölda þeirra.','Hæsta gildið í gagnasafninu.'],c:1,ok:'Tíðasta gildi er það gildi sem kemur oftast fyrir í gagnasafninu.',h:['Hugsaðu um hvað orðið tíðni segir okkur.']},nominal={id:'mode1',number:3,tag:'Nafnbreyta',q:'Gögn lýsa litum 100 bíla. Hvaða mælikvarða á miðsækni er hægt að nota?',o:['Meðaltal','Miðgildi','Tíðasta gildi','Allir þrír'],c:2,ok:'Tíðasta gildi má nota fyrir nafnabreytur eins og bíllit.',h:['Litir eru nafnbreyta. Hvaða mælikvarði byggist aðeins á tíðni?']};return `<div class="panel" id="panel-friday"><section><p class="section-kicker">${d.label} · Kaflar ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">Innlögn · 3.2.1</p><h2>Miðgildi úr bilskiptri tíðnidreifingu</h2><article class="card info-card"><p>${d.instruction}</p></article></section><section><p class="section-kicker">A · 3.2.1</p><h2>Finndu stærðirnar í formúlunni</h2><div class="a-visual">${d.table}</div>${d.questions.map((q,i)=>quizCard('friday',q,i,'a')).join('')}</section><section><p class="section-kicker">B · 3.2.1</p><h2>Sjálfstæð vinna</h2>${taskCard('friday',{id:'b1',tag:'Æfing 3 · dæmi 14',title:'Miðgildi bilskiptra gagna',paper:'Finndu miðgildisbilið og reiknaðu síðan miðgildið með aðferðinni úr 3.2.1. Sýndu vinnuna á blaði.'},0)}<details><summary>Meiri æfing</summary><div class="details-body"><p><strong>Æfing 3 · dæmi 16</strong> — valfrjálst og ekki hluti framvindu.</p></div></details></section><section class="subsection"><p class="section-kicker">A · Lestur og skilningur · 3.3</p><h2>Tíðasta gildi</h2><div class="section-intro">${d.reading}</div>${quizCard('friday',modeIntro,0,'mode')}${d.modeSets.map((s,i)=>modeQuestion(i,s)).join('')}${quizCard('friday',nominal,0,'mode')}</section><section><p class="section-kicker">B · Samþætting</p><h2>Lokaverkefni vikunnar</h2>${taskCard('friday',{id:'b3',tag:'Æfing 3 · dæmi 18',title:'Hvaða mælikvarði lýsir gögnunum best?',paper:'Vinna á blað: 1. Finndu heildarfjölda tannskemmda. 2. Finndu fjölda nemenda. 3. Skoðaðu hvernig gögnin dreifast. 4. Veldu þann mælikvarða á miðsækni sem lýsir gögnunum best. 5. Rökstyddu valið.',prompt:'Hvaða mælikvarða valdir þú og hvers vegna? Skrifaðu 1–2 setningar. Vísaðu í gögnin.',check:['Kemur skýrt fram hvaða mælikvarða þú valdir?','Vísar þú í dreifingu gagnanna?','Tókstu eftir háu gildunum 9 og 10?','Útskýrir þú hvernig þau skipta máli fyrir valið?']},0)}</section>${commonEnd('friday')}</div>`}
    function weeklyHTML(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 3 · Skjáskot</p><h2>Vikuskil</h2><p class="section-intro">Taktu eitt skjáskot af yfirlitinu þegar vinnu vikunnar er lokið.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 3</h3><div class="week-grid" id="weekGrid"></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="daysDone">0 af 3</strong>Loknir dagar</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar A-tilraunir</div></div><p><strong>Rangar tilraunir og sjálfsmat hafa ekki áhrif á stig eða framvindu.</strong></p></div><div class="card submission"><h3>Skilaðu eftirfarandi:</h3><ul><li>ljósmyndum eða skönnun af <strong>reiknuðum B-verkefnum</strong>;</li><li><strong>skjáskoti af framvinduyfirlitinu</strong>.</li></ul><button class="primary" id="submissionButton">Opna skilahólf</button></div></section></div>`}
    document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<button class="tab" data-tab="${id}">${l}</button>`).join('');
    document.getElementById('main').innerHTML=wednesdayHTML()+thursdayHTML()+fridayHTML()+weeklyHTML();
    function questionDef(id,qid){if(id==='thursday')return data.thursday.questions.find(q=>q.id===qid);if(id==='friday'&&qid==='mode1')return{tag:'Nafnbreyta',q:'',o:['Meðaltal','Miðgildi','Tíðasta gildi','Allir þrír'],c:2,ok:'Tíðasta gildi má nota fyrir nafnabreytur eins og bíllit.',h:['Litir eru nafnbreyta. Hvaða mælikvarði byggist aðeins á tíðni?']};if(id==='friday'&&qid==='mode2')return{tag:'Hugtakið',q:'',o:['Gildið sem liggur í miðju gagnasafnsins.','Gildið sem kemur oftast fyrir.','Summa allra gilda deilt með fjölda þeirra.','Hæsta gildið í gagnasafninu.'],c:1,ok:'Tíðasta gildi er það gildi sem kemur oftast fyrir í gagnasafninu.',h:['Hugsaðu um hvað orðið tíðni segir okkur.']};const i=Number(qid.replace('a',''))-1;return data[id].questions[i]}
    function renderQuestion(card){const id=card.dataset.day,qid=card.dataset.q,q=questionDef(id,qid),s=state[id],saved=s.selectedAnswers[qid],done=s.completedA.includes(qid),fb=card.querySelector('.feedback'),count=Number(s.wrongAttempts[qid])||0,opts=[...card.querySelectorAll('.option')];opts.forEach(x=>x.classList.remove('selected','correct','incorrect'));if(Number.isInteger(saved)){opts[saved]?.classList.add('selected',done?'correct':'incorrect');fb.className=`feedback show ${done?'good':'bad'}`;fb.textContent=done?`Rétt. ${q.ok}`:`Ekki rétt. ${q.h[Math.min(Math.max(count,1),q.h.length)-1]} Reyndu aftur.`}else{fb.className='feedback';fb.textContent=''}const c=card.querySelector('.attempt-count');c.hidden=!count;c.textContent=count?`Rangar tilraunir: ${count}`:''}
    document.querySelectorAll('.quiz-card').forEach(card=>{renderQuestion(card);card.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{const id=card.dataset.day,qid=card.dataset.q,s=state[id],q=questionDef(id,qid);if(s.completedA.includes(qid))return;const i=Number(btn.dataset.index);s.selectedAnswers[qid]=i;if(i===q.c)s.completedA.push(qid);else s.wrongAttempts[qid]=(Number(s.wrongAttempts[qid])||0)+1;saveDay(id);renderQuestion(card);updateAll()}))});
    document.querySelectorAll('.mode-card').forEach((card,i)=>{const id='friday',qid=`set${i+1}`,answer=data.friday.modeSets[i].answer,s=state.friday,fb=card.querySelector('.feedback');const render=()=>{card.querySelectorAll('.option').forEach(b=>{b.classList.remove('correct','incorrect','selected');if(s.selectedAnswers[qid]===b.dataset.value)b.classList.add(s.completedA.includes(qid)?'correct':'incorrect')});if(s.selectedAnswers[qid]){fb.className=`feedback show ${s.completedA.includes(qid)?'good':'bad'}`;fb.textContent=s.completedA.includes(qid)?'Rétt flokkun.':'Ekki rétt. Berðu saman tíðni allra gildanna.'}};card.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{if(s.completedA.includes(qid))return;s.selectedAnswers[qid]=btn.dataset.value;if(btn.dataset.value===answer)s.completedA.push(qid);else s.wrongAttempts[qid]=(Number(s.wrongAttempts[qid])||0)+1;saveDay(id);render();updateAll()}));render()});
    document.querySelectorAll('[data-text]').forEach(x=>{const s=state[x.dataset.day];x.value=s.textAnswers[x.dataset.text]||'';const check=document.getElementById(`check-${x.dataset.day}-${x.dataset.text}`),show=()=>{if(check)check.hidden=!x.value.trim()};show();x.addEventListener('input',()=>{s.textAnswers[x.dataset.text]=x.value;saveDay(x.dataset.day);show();updateAll()})});
    document.querySelectorAll('[data-b]').forEach(x=>{const s=state[x.dataset.day];x.checked=!!s.completedB[x.dataset.b];x.addEventListener('change',()=>{s.completedB[x.dataset.b]=x.checked;saveDay(x.dataset.day);updateAll()})});
    function groupDone(id,prefix,needed){return needed.every(q=>state[id].completedA.includes(q))}
    function wrongCount(id,ids){return ids.reduce((n,qid)=>n+(Number(state[id].wrongAttempts[qid])||0),0)}
    function counts(id){const s=state[id];if(id==='wednesday'){const ids=['a1','a2','a3'],a=groupDone(id,'a',ids)?1:0,b=['b1','b2','b3'].filter(x=>s.completedB[x]).length;return{done:a+b,total:4,wrong:wrongCount(id,ids)}}if(id==='thursday'){const ids=['a5','a6','a7','a8'],a=groupDone(id,'a',ids)?1:0,b1=s.completedB.b1?1:0,b2=s.completedB.b2&&(s.textAnswers.b2||'').trim()?1:0;return{done:a+b1+b2,total:3,wrong:wrongCount(id,ids)}}const aIds=['a1','a2','a3','a4'],modeIds=['mode2','set1','set2','set3','mode1'],a321=groupDone(id,'a',aIds)?1:0,b321=s.completedB.b1?1:0,a33=groupDone(id,'mode',modeIds)?1:0,last=s.completedB.b3&&(s.textAnswers.b3||'').trim()?1:0;return{done:a321+b321+a33+last,total:4,wrong:wrongCount(id,[...aIds,...modeIds])}}
    function selfSummary(id){const value=weekSelf[id]?.overall;return value==='green'?'🟢 Örugg/ur':value==='yellow'?'🟡 Smá óvissa':value==='red'?'🔴 Þarf að skoða aftur':'—'}
    function updateAll(){Object.keys(data).forEach(id=>document.getElementById(`complete-${id}`).classList.toggle('show',counts(id).done===counts(id).total));let done=0,total=0,daysDone=0,wrong=0,html='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">Lokið</div><div class="week-cell week-head">Kjarni</div><div class="week-cell week-head">Sjálfsmat</div><div class="week-cell week-head">Rangar</div>';Object.keys(data).forEach(id=>{const c=counts(id);done+=c.done;total+=c.total;wrong+=c.wrong;if(c.done===c.total)daysDone++;html+=`<div class="week-cell"><strong>${data[id].label}</strong></div><div class="week-cell">${c.done}/${c.total}</div><div class="week-cell">${c.done===c.total?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${selfSummary(id)}</div><div class="week-cell">${c.wrong}</div>`});document.getElementById('weekGrid').innerHTML=html;document.getElementById('weekProgress').textContent=`${Math.round(done/total*100)}%`;document.getElementById('daysDone').textContent=`${daysDone} af 3`;document.getElementById('wrongTotal').textContent=wrong;const active=document.querySelector('.tab.active')?.dataset.tab||'wednesday',bar=document.getElementById('progressBar'),label=document.getElementById('progressLabel');if(data[active]){const c=counts(active);bar.style.width=`${c.done/c.total*100}%`;label.textContent=`${c.done} af ${c.total} kjarnaverkefnum lokið`}else{bar.style.width=`${done/total*100}%`;label.textContent=`${done} af ${total} kjarnaverkefnum vikunnar lokið`}}
    let weekSelf={};try{weekSelf=JSON.parse(localStorage.getItem(WEEK_SELF_KEY))||{}}catch{}if(!weekSelf.wednesday&&!weekSelf.thursday&&!weekSelf.friday)weekSelf={...weekSelf,wednesday:{s1:weekSelf.s1,s3:weekSelf.s2},thursday:{s1:weekSelf.s3},friday:{s1:weekSelf.s4,s2:weekSelf.s5,s3:weekSelf.s6}};let selfMigrated=false;Object.keys(data).forEach(day=>{weekSelf[day]=weekSelf[day]||{};if(!weekSelf[day].overall){const oldValues=Object.values(weekSelf[day]).filter(v=>['green','yellow','red'].includes(v));if(oldValues.length){weekSelf[day].overall=oldValues.includes('red')?'red':oldValues.includes('yellow')?'yellow':'green';selfMigrated=true}}});if(selfMigrated)localStorage.setItem(WEEK_SELF_KEY,JSON.stringify(weekSelf));document.querySelectorAll('[data-self-day]').forEach(group=>{const day=group.dataset.selfDay;const render=()=>group.querySelectorAll('.self-button').forEach(b=>b.classList.toggle('active',weekSelf[day].overall===b.dataset.value));group.querySelectorAll('.self-button').forEach(b=>b.addEventListener('click',()=>{weekSelf[day].overall=b.dataset.value;localStorage.setItem(WEEK_SELF_KEY,JSON.stringify(weekSelf));render();updateAll()}));render()});
    function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${id}`));localStorage.setItem(TAB_KEY,id);updateAll();scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>switchTab(x.dataset.tab)));document.getElementById('submissionButton').addEventListener('click',()=>window.open(SUBMISSION_URL,'_blank','noopener'));const saved=localStorage.getItem(TAB_KEY);switchTab(tabs.some(([id])=>id===saved)?saved:'wednesday');
  })();
  </script>
